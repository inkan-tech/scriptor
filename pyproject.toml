[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scriptor"
version = "0.1.0"
description = "Scriptor — reMarkable cloud sync, handwriting OCR, and knowledge extraction"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Inkan", email = "contact@inkan.tech"}
]
keywords = ["remarkable", "handwriting", "ocr", "myscript", "notes", "sync", "knowledge"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: Text Processing",
]
dependencies = [
    "click>=8.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.33.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
rmscene = ["rmscene>=0.4.0"]
ocr = [
    "pillow>=12.1.1",
    "cairosvg>=2.9.0",
]
ai = [
    "anthropic>=2.8.0",
    "groq>=0.4.0",
    "httpx>=0.27.0",
]
monitor = ["aiohttp>=3.9.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.8.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/inkan-tech/scriptor"
Repository = "https://github.com/inkan-tech/scriptor"
Issues = "https://github.com/inkan-tech/scriptor/issues"

[project.scripts]
scriptor = "scriptor.panbot_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/scriptor"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.8.0",
    "mypy>=1.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
